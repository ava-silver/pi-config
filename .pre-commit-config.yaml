repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        files: ^skills/
      - id: end-of-file-fixer
        files: ^skills/

  - repo: local
    hooks:
      - id: fmt-pi-extensions
        name: format pi extensions
        entry: bun --cwd extensions fmt
        language: system
        pass_filenames: false
        files: ^extensions/.*\.(cjs|js|json|jsonc|jsx|mjs|ts|tsx)$
      - id: oxlint-pi-extensions
        name: oxlint pi extensions
        entry: bun --cwd extensions run lint
        language: system
        pass_filenames: false
        files: ^extensions/.*\.(cjs|js|jsx|mjs|ts|tsx)$
      - id: typecheck-pi-extensions
        name: typecheck pi extensions
        entry: bun --cwd extensions check
        language: system
        pass_filenames: false
        files: ^extensions/.*\.(cjs|js|json|jsonc|jsx|mjs|ts|tsx)$
      - id: validate-skill-metadata
        name: validate skill metadata
        entry: bun scripts/validate-skills.ts
        language: system
        files: ^skills/[^/]+/SKILL\.md$
